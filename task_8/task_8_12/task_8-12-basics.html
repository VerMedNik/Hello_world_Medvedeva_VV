<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task_8-12-2</title>
    <meta name="description" content="Задание номер 12 в теме 8">
    <meta name="author" content="Nika Bear">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
    
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f9f9f9;
            line-height: 1.5;
        }

        h1, h2, h3 {
            color: #2c3e50;
            margin-top: 0;
        }

        #title {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        p {
            color: #333;
            margin: 10px 0;
        }

        .lead {
            font-size: 1.2rem;
            font-weight: bold;
            color: #16a085;
        }

        .box.highlight {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
        }

        .box.highlight.large {
            font-size: 1.3rem;
            padding: 20px;
            border: 2px solid #fdcb6e;
        }
    </style>
</head>

<body>
    <h1 id="title">Заголовок страницы</h1>
    <p>Обычный абзац текста без класса.</p>
    <p class="lead">Абзац с классом lead — выделенный текст.</p>
    <div class="box">Блок с классом box</div>
    <div class="box highlight">Блок с классами box и highlight</div>
    <div class="box highlight large">Блок с классами box, highlight и large</div>
</body>
</html>
